name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm run test:unit

      - name: Verify web build
        run: pnpm run verify:web

      # Two builds of one commit must be byte-identical, so anyone can check
      # the live bundle against a build of the commit it claims
      # (docs/BUNDLE_VERIFICATION.md).
      - name: Bundle is reproducible
        env:
          ADAPTER: cloudflare
          BUILD_VERSION: ${{ github.sha }}
        run: |
          pnpm build > /dev/null
          first=$(node scripts/bundle-digest.mjs --dir=.svelte-kit/cloudflare | awk '/digest/ {print $2}')
          pnpm build > /dev/null
          second=$(node scripts/bundle-digest.mjs --dir=.svelte-kit/cloudflare | awk '/digest/ {print $2}')
          echo "Bundle digest for ${{ github.sha }}: $first" >> "$GITHUB_STEP_SUMMARY"
          test -n "$first" && test "$first" = "$second"

      - name: Run required E2E suite (blocking)
        id: required_e2e
        env:
          TMPDIR: ${{ runner.temp }}
        run: pnpm run test:e2e:ci --trace=retain-on-failure

      - name: Retain required browser failure evidence
        if: ${{ !cancelled() && steps.required_e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: required-browser-evidence
          path: |
            test-results/
            ${{ runner.temp }}/mindline-signaling.log
          retention-days: 7

      - name: Run best-effort E2E suite (non-blocking)
        id: best_effort_e2e
        continue-on-error: true
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash scripts/test-e2e-with-signaling.sh --trace=retain-on-failure --project='Desktop Chrome' tests/e2e/edit-delete.spec.ts tests/e2e/mobile-p2p.spec.ts tests/e2e/p2p-multiuser.spec.ts tests/e2e/peer-list.spec.ts tests/e2e/reactions.spec.ts tests/e2e/typing-indicators.spec.ts

      - name: Retain best-effort browser failure evidence
        if: ${{ !cancelled() && steps.best_effort_e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: best-effort-browser-evidence
          path: |
            test-results/
            ${{ runner.temp }}/mindline-signaling.log
          retention-days: 7

      - name: Verify build artifacts
        run: |
          ls -la build/
          test -f build/index.js
          test -f build/handler.js
